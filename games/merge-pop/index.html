<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Merge Pop, a Three.js playable ad</title>
<style>
  :root { --hud: #ffffff; --ink: #1b2a63; --shadow: 0 2px 10px rgba(10, 14, 50, 0.5); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 35%, #5a3fd0, #2a1f78 70%);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #caption {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 56px); left: 0; right: 0; text-align: center;
    color: var(--hud); font-size: 30px; font-weight: 900; letter-spacing: 0.02em; text-shadow: var(--shadow);
    pointer-events: none; transition: opacity 0.5s, transform 0.5s;
  }
  #caption.gone { opacity: 0; transform: translateY(-16px); }
  #caption b { color: #ffe14d; }

  #progress {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 16px; right: 122px; height: 10px;
    background: rgba(255, 255, 255, 0.28); border-radius: 999px; overflow: hidden; pointer-events: none;
  }
  #fill { width: 100%; height: 100%; background: #ffe14d; border-radius: 999px; transform-origin: left; transform: scaleX(0); transition: transform 0.3s ease-out; }

  #marks { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 32px); left: 16px; right: 122px; height: 16px; pointer-events: none; }
  #marks span { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 900; color: #fff; text-shadow: var(--shadow); opacity: 0.85; }
  #marks span::before { content: ""; position: absolute; left: 50%; top: -17px; width: 2px; height: 10px; background: rgba(255, 255, 255, 0.85); transform: translateX(-50%); }
  #marks .m128 { right: 2px; left: auto; transform: none; color: #ffe14d; }
  #marks .m128::before { display: none; }
  #marks.reached .m64 { color: #ffe14d; opacity: 1; animation: throb 0.6s ease-in-out infinite; }
  #progress.flash { animation: flash 0.5s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255, 225, 77, 0.9); } 100% { box-shadow: 0 0 0 14px rgba(255, 225, 77, 0); } }

  #streak {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh + 78px); left: 50%; margin-left: -88px; width: 176px; justify-content: center; display: flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); color: #fff; opacity: 0;
    transition: opacity 0.2s, transform 0.12s; pointer-events: none;
  }
  #streak.on { opacity: 1; }
  #streak.bump { transform: scale(1.18); }
  #streak small { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; opacity: 0.85; }
  #mult { font-size: 22px; font-weight: 900; color: #ffe14d; text-shadow: var(--shadow); }
  #pips { display: flex; gap: 3px; }
  #pips i { width: 9px; height: 14px; border-radius: 3px; background: rgba(255, 255, 255, 0.25); transition: background 0.15s; }
  #pips i.lit { background: #ffe14d; box-shadow: 0 0 8px rgba(255, 225, 77, 0.8); }

  #booster {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh + 142px); transform: translateX(-50%); padding: 13px 22px;
    font-size: 17px; letter-spacing: 0.04em; z-index: 4; background: #ff5d8a; color: #fff;
    box-shadow: 0 4px 0 #b3335a, 0 8px 18px rgba(10, 14, 50, 0.35); animation: beat 1s ease-in-out infinite; white-space: nowrap;
  }
  @keyframes beat { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.07); } }
  #marks .m64 { left: 85.714%; }
  #booster small { display: block; font-size: 11px; font-weight: 800; opacity: 0.85; letter-spacing: 0.1em; }
  #booster.armed { background: #ffe14d; color: var(--ink); box-shadow: 0 4px 0 #d6a800, 0 8px 18px rgba(10, 14, 50, 0.35); }
  #end-install { animation: tease 1.1s ease-in-out infinite; }

  #stats {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh); left: 0; right: 0; display: flex; justify-content: center; gap: 14px;
    pointer-events: none;
  }
  .chip {
    min-width: 112px; padding: 8px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.14); color: #fff;
    text-align: center; backdrop-filter: blur(3px); transition: transform 0.12s ease-out, background 0.2s;
  }
  .chip small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; opacity: 0.8; }
  .chip b { font-size: 30px; line-height: 1.1; }
  .chip.bump { transform: scale(1.18); }
  .chip.urgent { background: rgba(255, 70, 90, 0.55); animation: throb 0.6s ease-in-out infinite; }
  @keyframes throb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  #toast {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 100px); left: 0; right: 0;
    text-align: center; color: var(--hud); font-size: 28px; font-weight: 900; letter-spacing: 0.06em;
    text-shadow: var(--shadow); opacity: 0; pointer-events: none;
  }
  #toast.show { animation: pop 0.95s ease-out; }
  #toast.gold { color: #ffe14d; }
  #toast.red { color: #ff7a8a; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 20% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0; transform: scale(1) translateY(-14px); } }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop {
    position: absolute; left: 0; top: 0; color: #fff; font-weight: 900; font-size: 34px; text-shadow: var(--shadow);
    animation: float-up 0.9s ease-out forwards;
  }
  .pop.big { color: #ffe14d; font-size: 46px; }
  @keyframes float-up { from { opacity: 1; margin-top: 0; transform: translate(-50%, -50%) scale(0.7); } 25% { transform: translate(-50%, -50%) scale(1.25); } to { opacity: 0; margin-top: -80px; transform: translate(-50%, -50%) scale(1); } }

  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 19vh);
    text-align: center; color: var(--hud); font-size: 22px; font-weight: 900; letter-spacing: 0.1em; text-shadow: var(--shadow); pointer-events: none;
  }
  #hint.hidden { display: none; }
  #hint .track { position: relative; width: 190px; height: 58px; margin: 10px auto 0; }
  #hint .finger {
    position: absolute; top: 0; left: 0; width: 50px; height: 50px; border-radius: 50%;
    border: 4px solid #fff; box-shadow: var(--shadow); animation: swipe 1.3s ease-in-out infinite;
  }
  #hint.nudge .finger { animation-duration: 0.65s; }
  @keyframes swipe { 0% { transform: translateX(0); opacity: 0.2; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(140px); opacity: 0.2; } }

  .cta {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; color: var(--ink);
    background: #ffe14d; border-radius: 999px; box-shadow: 0 4px 0 #d6a800, 0 8px 18px rgba(10, 14, 50, 0.35);
  }
  .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #d6a800; }
  #install { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 4px); right: 14px; min-width: 44px; min-height: 44px; padding: 11px 18px; font-size: 15px; z-index: 5; }

  #end {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(18, 14, 60, 0.6); backdrop-filter: blur(3px); z-index: 6;
  }
  #end.show { display: flex; }
  .card {
    width: min(86vw, 360px); text-align: center; padding: 26px 22px 22px; border-radius: 26px;
    background: #ffffff; color: var(--ink); box-shadow: 0 18px 50px rgba(10, 16, 50, 0.5);
    animation: rise 0.45s cubic-bezier(0.2, 1.3, 0.4, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(0.92); } to { opacity: 1; transform: none; } }
  .card h1 { font-size: 30px; line-height: 1.1; margin-bottom: 8px; }
  #stars { font-size: 38px; letter-spacing: 6px; margin-bottom: 4px; color: #ffb800; min-height: 46px; }
  #stars .off { color: #d8def0; }
  #stars span { display: inline-block; animation: star-in 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) backwards; }
  #stars span:nth-child(2) { animation-delay: 0.15s; }
  #stars span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes star-in { from { opacity: 0; transform: scale(0) rotate(-60deg); } to { opacity: 1; transform: none; } }
  .card p { font-size: 17px; opacity: 0.75; margin-bottom: 18px; }
  .card p.teaser { font-weight: 800; opacity: 1; color: #d64b00; margin-top: -8px; animation: tease 1.2s ease-in-out infinite; }
  @keyframes tease { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .card .cta { display: block; width: 100%; padding: 16px; font-size: 20px; }
  .card .retry {
    appearance: none; cursor: pointer; font: inherit; font-weight: 800; font-size: 17px; color: var(--ink);
    background: transparent; border: 3px solid var(--ink); border-radius: 999px; width: 100%; padding: 12px; margin-top: 12px;
  }
  .card .again { appearance: none; border: 0; background: none; color: #4a5aa8; font: inherit; font-size: 15px; min-height: 44px; padding: 10px 16px; margin-top: 6px; cursor: pointer; text-decoration: underline; }
  .hidden { display: none !important; }
  @media (max-height: 500px) {
    #caption { top: calc(env(safe-area-inset-top, 0px) + 34px); font-size: 20px; }
    #toast { top: calc(env(safe-area-inset-top, 0px) + 60px); font-size: 20px; }
    #stats { bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); gap: 10px; }
    .chip { min-width: 84px; padding: 4px 12px; border-radius: 12px; }
    .chip small { font-size: 10px; }
    .chip b { font-size: 20px; }
    #streak { bottom: calc(env(safe-area-inset-bottom, 0px) + 58px); padding: 3px 10px; }
    #booster { bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); left: auto; right: 14px; transform: none; padding: 10px 14px; font-size: 13px; animation: none; }
    #hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); font-size: 16px; }
    #hint .track { height: 32px; margin-top: 4px; }
    #hint .finger { width: 30px; height: 30px; }
    .card { padding: 14px 18px; max-height: 92vh; overflow-y: auto; }
    .card h1 { font-size: 24px; margin-bottom: 4px; }
    #stars { font-size: 28px; min-height: 32px; }
    .card p { font-size: 14px; margin-bottom: 10px; }
    .card .cta { padding: 12px; font-size: 17px; }
    .card .retry { padding: 10px; font-size: 15px; margin-top: 8px; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Merge Pop playable ad"></canvas>
<div id="progress" aria-hidden="true"><div id="fill"></div></div>
<div id="marks" aria-hidden="true"><span class="m64">64</span><span class="m128">128</span></div>
<div id="streak" aria-hidden="true"><small>STREAK</small><div id="pips"><i></i><i></i><i></i><i></i><i></i><i></i></div><b id="mult">x1</b></div>
<div id="caption">Can you merge to <b>128</b>?</div>
<div id="stats">
  <div class="chip" id="score-chip"><small>SCORE</small><b id="score">0</b></div>
  <div class="chip" id="moves-chip"><small>MOVES</small><b id="moves">24</b></div>
</div>
<div id="toast"></div>
<div id="pops"></div>
<div id="hint">SWIPE TO MERGE<div class="track"><span class="finger"></span></div></div>
<button id="booster" class="cta hidden" type="button">FREE SMASH<small>REMOVE ANY TILE</small></button>
<button id="install" class="cta" type="button">INSTALL</button>
<div id="end" role="dialog" aria-modal="true" aria-labelledby="end-title">
  <div class="card">
    <h1 id="end-title">128!</h1>
    <div id="stars" aria-hidden="true"></div>
    <p id="end-text">Score 0</p>
    <p id="teaser" class="teaser"></p>
    <button id="end-install" class="cta" type="button">PLAY LEVEL 2</button>
    <button id="retry" class="retry" type="button">TRY AGAIN</button>
    <button id="again" class="again hidden" type="button">Play again</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
