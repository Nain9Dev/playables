<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stack Tower, a Three.js playable ad</title>
<style>
  :root { --hud: #ffffff; --ink: #1b2a63; --shadow: 0 2px 10px rgba(20, 30, 70, 0.35); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, hsl(200, 70%, 80%), hsl(235, 65%, 62%));
    transition: background 0.8s ease;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #progress {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 16px; right: 112px; height: 10px;
    background: rgba(255, 255, 255, 0.35); border-radius: 999px; overflow: hidden; pointer-events: none;
  }
  #fill { width: 100%; height: 100%; background: #ffe14d; border-radius: 999px; transform-origin: left; transform: scaleX(0); transition: transform 0.25s ease-out; }

  #score {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 0; right: 0;
    text-align: center; color: var(--hud); font-size: 64px; font-weight: 800;
    text-shadow: var(--shadow); pointer-events: none; transition: transform 0.12s ease-out;
  }
  #score.bump { transform: scale(1.22); }
  #toast {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 112px); left: 0; right: 0;
    text-align: center; color: var(--hud); font-size: 22px; font-weight: 800; letter-spacing: 0.08em;
    text-shadow: var(--shadow); opacity: 0; pointer-events: none;
  }
  #toast.show { animation: pop 0.8s ease-out; }
  #toast.gold { color: #ffe14d; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 20% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0; transform: scale(1) translateY(-14px); } }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .score-pop {
    position: absolute; top: 46%; left: 50%; color: #fff; font-weight: 800; font-size: 34px; text-shadow: var(--shadow);
    animation: float-up 0.9s ease-out forwards;
  }
  .score-pop.big { color: #ffe14d; font-size: 44px; }
  @keyframes float-up { from { opacity: 1; transform: translate(-50%, 0) scale(0.7); } 25% { transform: translate(-50%, -18px) scale(1.2); } to { opacity: 0; transform: translate(-50%, -90px) scale(1); } }

  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12vh);
    text-align: center; color: var(--hud); font-size: 26px; font-weight: 800; letter-spacing: 0.1em;
    text-shadow: var(--shadow); pointer-events: none; animation: bob 1s ease-in-out infinite;
  }
  #hint.hidden { display: none; }
  #hint.nudge { animation: shake 0.5s ease-in-out infinite; }
  #hint .finger {
    display: block; width: 54px; height: 54px; margin: 14px auto 0; border-radius: 50%;
    border: 4px solid #fff; box-shadow: var(--shadow); animation: tap 1s ease-in-out infinite;
  }
  @keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.06); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes tap { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(0.72); opacity: 0.55; } }

  .cta {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; color: var(--ink);
    background: #ffe14d; border-radius: 999px; box-shadow: 0 4px 0 #d6a800, 0 8px 18px rgba(20, 30, 70, 0.3);
  }
  .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #d6a800; }
  #install { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 2px); right: 14px; padding: 9px 18px; font-size: 15px; }

  #end {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(18, 26, 66, 0.55); backdrop-filter: blur(3px);
  }
  #end.show { display: flex; }
  .card {
    width: min(86vw, 360px); text-align: center; padding: 26px 22px 22px; border-radius: 26px;
    background: #ffffff; color: var(--ink); box-shadow: 0 18px 50px rgba(10, 16, 50, 0.45);
    animation: rise 0.45s cubic-bezier(0.2, 1.3, 0.4, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(0.92); } to { opacity: 1; transform: none; } }
  .card h1 { font-size: 30px; line-height: 1.1; margin-bottom: 8px; }
  #stars { font-size: 38px; letter-spacing: 6px; margin-bottom: 4px; color: #ffb800; min-height: 46px; }
  #stars .off { color: #d8def0; }
  #stars span { display: inline-block; animation: star-in 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) backwards; }
  #stars span:nth-child(2) { animation-delay: 0.15s; }
  #stars span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes star-in { from { opacity: 0; transform: scale(0) rotate(-60deg); } to { opacity: 1; transform: none; } }
  .card p { font-size: 17px; opacity: 0.75; margin-bottom: 18px; }
  .card .cta { display: block; width: 100%; padding: 16px; font-size: 20px; }
  .card .retry {
    appearance: none; cursor: pointer; font: inherit; font-weight: 800; font-size: 17px; color: var(--ink);
    background: transparent; border: 3px solid var(--ink); border-radius: 999px; width: 100%; padding: 12px; margin-top: 12px;
  }
  .card .again {
    appearance: none; border: 0; background: none; color: #4a5aa8; font: inherit; font-size: 15px;
    margin-top: 14px; cursor: pointer; text-decoration: underline;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Stack Tower playable ad"></canvas>
<div id="progress" aria-hidden="true"><div id="fill"></div></div>
<div id="score" aria-live="polite">0</div>
<div id="toast"></div>
<div id="pops"></div>
<div id="hint">TAP TO STACK<span class="finger"></span></div>
<button id="install" class="cta" type="button">INSTALL</button>
<div id="end" role="dialog" aria-modal="true" aria-labelledby="end-title">
  <div class="card">
    <h1 id="end-title">Nice stack!</h1>
    <div id="stars" aria-hidden="true"></div>
    <p id="end-text">Score 0</p>
    <button id="end-install" class="cta" type="button">INSTALL NOW</button>
    <button id="retry" class="retry" type="button">TRY AGAIN</button>
    <button id="again" class="again hidden" type="button">Play again</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
