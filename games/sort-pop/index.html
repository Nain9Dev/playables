<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sort Pop, a Three.js playable ad</title>
<style>
  :root { --hud: #ffffff; --ink: #0d2b4d; --gold: #ffd84a; --shadow: 0 2px 10px rgba(4, 16, 40, 0.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 32%, #1d7a92, #0c2c55 62%, #07162f);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #caption {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 40px); left: 0; right: 0; padding: 0 16px; text-align: center;
    color: var(--hud); font-size: clamp(22px, 6.6vw, 31px); font-weight: 900; letter-spacing: 0.01em; text-shadow: var(--shadow);
    pointer-events: none; transition: opacity 0.5s, transform 0.5s;
  }
  #caption.gone { opacity: 0; transform: translateY(-16px); }
  #caption b { color: var(--gold); }

  #progress {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 112px; height: 12px;
    background: rgba(255, 255, 255, 0.24); border-radius: 999px; overflow: hidden; pointer-events: none;
  }
  #fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ffd84a, #ffb020); border-radius: 999px; transform-origin: left; transform: scaleX(0.04); transition: transform 0.4s cubic-bezier(0.2, 1.2, 0.4, 1); }

  #stats {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 5vh); left: 0; right: 0; display: flex; justify-content: center; gap: 14px;
    pointer-events: none;
  }
  .chip {
    min-width: 108px; padding: 8px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.14); color: #fff;
    text-align: center; backdrop-filter: blur(3px); transition: transform 0.12s ease-out, background 0.2s;
  }
  .chip small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; opacity: 0.8; }
  .chip b { font-size: 30px; line-height: 1.1; }
  .chip.bump { transform: scale(1.18); }
  .chip.urgent { background: rgba(255, 70, 90, 0.6); animation: throb 0.6s ease-in-out infinite; }
  @keyframes throb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  #toast {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 112px); left: 0; right: 0;
    text-align: center; color: var(--hud); font-size: 30px; font-weight: 900; letter-spacing: 0.06em;
    text-shadow: var(--shadow); opacity: 0; pointer-events: none;
  }
  #toast.show { animation: pop 1.1s ease-out; }
  #toast.gold { color: var(--gold); }
  #toast.red { color: #ff8a98; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 18% { opacity: 1; transform: scale(1.18); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1) translateY(-14px); } }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop {
    position: absolute; left: 0; top: 0; color: var(--gold); font-weight: 900; font-size: 36px; text-shadow: var(--shadow);
    animation: float-up 1s ease-out forwards;
  }
  @keyframes float-up { from { opacity: 1; margin-top: 0; transform: translate(-50%, -50%) scale(0.7); } 25% { transform: translate(-50%, -50%) scale(1.25); } to { opacity: 0; margin-top: -90px; transform: translate(-50%, -50%) scale(1); } }

  #finger {
    position: fixed; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: none;
    background: rgba(255, 255, 255, 0.28); border: 4px solid #fff; box-shadow: var(--shadow); opacity: 0;
    transition: left 0.62s cubic-bezier(0.45, 0, 0.25, 1), top 0.62s cubic-bezier(0.45, 0, 0.25, 1), opacity 0.25s, transform 0.14s;
    z-index: 4;
  }
  #finger.snap { transition: opacity 0.25s; }
  #finger.show { opacity: 1; }
  #finger.press { transform: scale(0.78); background: rgba(255, 255, 255, 0.6); }
  #finger::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #fff; opacity: 0;
  }
  #finger.press::after { animation: ripple 0.5s ease-out; }
  @keyframes ripple { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(2.1); } }

  .cta {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; color: var(--ink);
    background: var(--gold); border-radius: 999px; box-shadow: 0 4px 0 #d19a00, 0 8px 18px rgba(4, 16, 40, 0.35);
  }
  .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #d19a00; }
  #install { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 2px); right: 14px; padding: 9px 18px; font-size: 15px; z-index: 5; }
  #sound {
    position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 5vh + 6px); width: 44px; height: 44px; z-index: 5;
    border-radius: 50%; border: 0; cursor: pointer; background: rgba(255, 255, 255, 0.16); color: #fff; display: grid; place-items: center;
  }
  #sound svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #sound .off { display: none; }
  #sound.muted .on { display: none; }
  #sound.muted .off { display: block; }

  #end {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5, 16, 40, 0.62); backdrop-filter: blur(3px); z-index: 6;
  }
  #end.show { display: flex; }
  .card {
    width: min(86vw, 360px); text-align: center; padding: 26px 22px 22px; border-radius: 26px;
    background: #ffffff; color: var(--ink); box-shadow: 0 18px 50px rgba(4, 12, 36, 0.55);
    animation: rise 0.45s cubic-bezier(0.2, 1.3, 0.4, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(0.92); } to { opacity: 1; transform: none; } }
  .card h1 { font-size: 30px; line-height: 1.1; margin-bottom: 8px; }
  #stars { font-size: 38px; letter-spacing: 6px; margin-bottom: 4px; color: #ffb800; min-height: 46px; }
  #stars .off { color: #d4dcef; }
  #stars span { display: inline-block; animation: star-in 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) backwards; }
  #stars span:nth-child(2) { animation-delay: 0.15s; }
  #stars span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes star-in { from { opacity: 0; transform: scale(0) rotate(-60deg); } to { opacity: 1; transform: none; } }
  .card p { font-size: 17px; opacity: 0.75; margin-bottom: 18px; }
  .card p.teaser { font-weight: 800; opacity: 1; color: #d64b00; margin-top: -8px; animation: tease 1.2s ease-in-out infinite; }
  @keyframes tease { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .card .cta { display: block; width: 100%; padding: 16px; font-size: 20px; }
  #end-install { animation: tease 1.15s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { #end-install { animation: none; } }
  .card .retry {
    appearance: none; cursor: pointer; font: inherit; font-weight: 800; font-size: 17px; color: var(--ink);
    background: transparent; border: 3px solid var(--ink); border-radius: 999px; width: 100%; padding: 12px; margin-top: 12px;
  }
  .card .again { appearance: none; border: 0; background: none; color: #3b5a8a; font: inherit; font-size: 15px; margin-top: 14px; cursor: pointer; text-decoration: underline; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Sort Pop playable ad"></canvas>
<div id="progress" aria-hidden="true"><div id="fill"></div></div>
<div id="caption">Sort the colors in <b id="goal">13</b> moves!</div>
<div id="stats">
  <div class="chip" id="tubes-chip"><small>SORTED</small><b id="tubes">0/5</b></div>
  <div class="chip" id="moves-chip"><small>MOVES</small><b id="moves">13</b></div>
</div>
<button id="sound" type="button" aria-label="Sound on or off">
  <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<div id="toast"></div>
<div id="pops"></div>
<div id="finger" aria-hidden="true"></div>
<button id="install" class="cta" type="button">INSTALL</button>
<div id="end" role="dialog" aria-modal="true" aria-labelledby="end-title">
  <div class="card">
    <h1 id="end-title">Sorted!</h1>
    <div id="stars" aria-hidden="true"></div>
    <p id="end-text">Done</p>
    <p id="teaser" class="teaser"></p>
    <button id="end-install" class="cta" type="button">PLAY LEVEL 2</button>
    <button id="retry" class="retry" type="button">TRY AGAIN</button>
    <button id="again" class="again hidden" type="button">Play again</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
