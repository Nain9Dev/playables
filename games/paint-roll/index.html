<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paint Roll, a Three.js playable ad</title>
<style>
  :root { --hud: #ffffff; --ink: #1b2254; --gold: #ffe14d; --shadow: 0 2px 10px rgba(10, 14, 48, 0.45); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #3a46b8, #191d59 68%, #101238);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #progress {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 16px; right: 122px; height: 12px;
    background: rgba(255, 255, 255, 0.24); border-radius: 999px; overflow: hidden; pointer-events: none;
  }
  #fill {
    width: 100%; height: 100%; background: linear-gradient(90deg, #ff2f85, #00d4ff); border-radius: 999px;
    transform-origin: left; transform: scaleX(0.05); transition: transform 0.25s ease-out;
  }

  #caption {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 56px); left: 0; right: 0; padding: 0 16px; text-align: center;
    color: var(--hud); font-size: clamp(22px, 6.8vw, 32px); font-weight: 900; text-shadow: var(--shadow);
    pointer-events: none; transition: opacity 0.45s, transform 0.45s;
  }
  #caption.gone { opacity: 0; transform: translateY(-16px); }
  #caption b { color: var(--gold); }

  #stats {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 5vh); left: 0; right: 0; display: flex; justify-content: center; gap: 14px;
    pointer-events: none;
  }
  .chip {
    min-width: 110px; padding: 8px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.14); color: #fff;
    text-align: center; backdrop-filter: blur(3px); transition: transform 0.12s ease-out, background 0.2s;
  }
  .chip small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; opacity: 0.8; }
  .chip b { font-size: 30px; line-height: 1.1; }
  .chip.bump { transform: scale(1.18); }
  .chip.urgent { background: rgba(255, 65, 95, 0.6); animation: throb 0.6s ease-in-out infinite; }
  @keyframes throb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  #toast {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 108px); left: 0; right: 0; text-align: center;
    color: var(--hud); font-size: 28px; font-weight: 900; letter-spacing: 0.06em; text-shadow: var(--shadow);
    opacity: 0; pointer-events: none;
  }
  #toast.show { animation: pop 1s ease-out; }
  #toast.gold { color: var(--gold); }
  #toast.red { color: #ff7a8a; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 20% { opacity: 1; transform: scale(1.18); } 100% { opacity: 0; transform: scale(1) translateY(-14px); } }

  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop {
    position: absolute; left: 0; top: 0; color: #fff; font-weight: 900; font-size: 32px; text-shadow: var(--shadow);
    animation: float-up 0.9s ease-out forwards;
  }
  .pop.big { color: var(--gold); font-size: 42px; }
  @keyframes float-up { from { opacity: 1; margin-top: 0; transform: translate(-50%, -50%) scale(0.7); } 25% { transform: translate(-50%, -50%) scale(1.25); } to { opacity: 0; margin-top: -80px; transform: translate(-50%, -50%) scale(1); } }

  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18vh);
    text-align: center; color: var(--hud); font-size: 22px; font-weight: 900; letter-spacing: 0.1em; text-shadow: var(--shadow); pointer-events: none;
  }
  #hint.hidden { display: none; }
  #hint .track { position: relative; width: 180px; height: 54px; margin: 10px auto 0; }
  #hint .finger {
    position: absolute; top: 0; left: 0; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #fff; box-shadow: var(--shadow); animation: swipe 1.3s ease-in-out infinite;
  }
  #hint.nudge .finger { animation-duration: 0.65s; }
  @keyframes swipe { 0% { transform: translateX(0); opacity: 0.2; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(132px); opacity: 0.2; } }

  .cta {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; color: var(--ink);
    background: var(--gold); border-radius: 999px; box-shadow: 0 4px 0 #d4a100, 0 8px 18px rgba(10, 14, 48, 0.35);
  }
  .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #d4a100; }
  #install { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 4px); right: 14px; min-width: 44px; min-height: 44px; padding: 11px 18px; font-size: 15px; z-index: 5; }
  #sound {
    position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 5vh + 6px); width: 44px; height: 44px; z-index: 5;
    border-radius: 50%; border: 0; cursor: pointer; background: rgba(255, 255, 255, 0.16); color: #fff; display: grid; place-items: center;
  }
  #sound svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #sound .off { display: none; }
  #sound.muted .on { display: none; }
  #sound.muted .off { display: block; }

  #end {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(12, 14, 46, 0.62); backdrop-filter: blur(3px); z-index: 6;
  }
  #end.show { display: flex; }
  .card {
    width: min(86vw, 360px); text-align: center; padding: 26px 22px 22px; border-radius: 26px;
    background: #ffffff; color: var(--ink); box-shadow: 0 18px 50px rgba(8, 12, 42, 0.52);
    animation: rise 0.45s cubic-bezier(0.2, 1.3, 0.4, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(0.92); } to { opacity: 1; transform: none; } }
  .card h1 { font-size: 30px; line-height: 1.1; margin-bottom: 8px; }
  #stars { font-size: 38px; letter-spacing: 6px; margin-bottom: 4px; color: #ffb800; min-height: 46px; }
  #stars .off { color: #d8def0; }
  #stars span { display: inline-block; animation: star-in 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) backwards; }
  #stars span:nth-child(2) { animation-delay: 0.15s; }
  #stars span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes star-in { from { opacity: 0; transform: scale(0) rotate(-60deg); } to { opacity: 1; transform: none; } }
  .card p { font-size: 17px; opacity: 0.75; margin-bottom: 18px; }
  .card p.teaser { font-weight: 800; opacity: 1; color: #d64b00; margin-top: -8px; animation: tease 1.2s ease-in-out infinite; }
  @keyframes tease { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .card .cta { display: block; width: 100%; padding: 16px; font-size: 20px; }
  #end-install { animation: tease 1.15s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { #end-install { animation: none; } }
  .card .retry {
    appearance: none; cursor: pointer; font: inherit; font-weight: 800; font-size: 17px; color: var(--ink);
    background: transparent; border: 3px solid var(--ink); border-radius: 999px; width: 100%; padding: 12px; margin-top: 12px;
  }
  .card .again { appearance: none; border: 0; background: none; color: #3b4f94; font: inherit; font-size: 15px; min-height: 44px; padding: 10px 16px; margin-top: 6px; cursor: pointer; text-decoration: underline; }
  .hidden { display: none !important; }
  @media (max-height: 500px) {
    #caption { top: calc(env(safe-area-inset-top, 0px) + 46px); font-size: 20px; }
    #toast { top: calc(env(safe-area-inset-top, 0px) + 64px); font-size: 20px; }
    #stats { bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); gap: 10px; }
    .chip { min-width: 84px; padding: 4px 12px; border-radius: 12px; }
    .chip small { font-size: 10px; }
    .chip b { font-size: 20px; }
    #sound { bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
    #hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 58px); font-size: 16px; }
    #hint .track { height: 32px; margin-top: 4px; }
    #hint .finger { width: 30px; height: 30px; }
    .card { padding: 14px 18px; max-height: 92vh; overflow-y: auto; }
    .card h1 { font-size: 24px; margin-bottom: 4px; }
    #stars { font-size: 28px; min-height: 32px; }
    .card p { font-size: 14px; margin-bottom: 10px; }
    .card .cta { padding: 12px; font-size: 17px; }
    .card .retry { padding: 10px; font-size: 15px; margin-top: 8px; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Paint Roll playable ad"></canvas>
<div id="progress" aria-hidden="true"><div id="fill"></div></div>
<div id="caption">Can you <b>paint</b> it all?</div>
<div id="stats">
  <div class="chip" id="pct-chip"><small>PAINTED</small><b id="pct">5%</b></div>
  <div class="chip" id="moves-chip"><small>MOVES</small><b id="moves">12</b></div>
</div>
<button id="sound" type="button" aria-label="Sound on or off">
  <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<div id="toast"></div>
<div id="pops"></div>
<div id="hint">SWIPE TO PAINT<div class="track"><span class="finger"></span></div></div>
<button id="install" class="cta" type="button">INSTALL</button>
<div id="end" role="dialog" aria-modal="true" aria-labelledby="end-title">
  <div class="card">
    <h1 id="end-title">Painted!</h1>
    <div id="stars" aria-hidden="true"></div>
    <p id="end-text">0 pts</p>
    <p id="teaser" class="teaser"></p>
    <button id="end-install" class="cta" type="button">PLAY LEVEL 2</button>
    <button id="retry" class="retry" type="button">TRY AGAIN</button>
    <button id="again" class="again hidden" type="button">Play again</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
